<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정형외과 유튜브 트렌드</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0efea;
    --text: #1a1a1a; --text2: #6b6b6b; --text3: #a0a09a;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
    --teal: #1D9E75; --teal-light: #E1F5EE; --teal-mid: #5DCAA5; --teal-dark: #085041;
    --amber-light: #FAEEDA; --amber-dark: #633806;
    --r: 8px; --rl: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 4rem; }

  .top-bar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.75rem; gap: 12px; }
  .brand-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .brand-sub { font-size: 13px; color: var(--text3); }

  .auth-pill { display: flex; align-items: center; gap: 8px; padding: 7px 16px; border: 1px solid var(--border2); border-radius: 999px; background: var(--bg); cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
  .auth-pill:hover { background: var(--bg3); border-color: var(--teal-mid); }
  .adot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); transition: background 0.2s; }
  .adot.on { background: var(--teal); }
  .alabel { font-size: 13px; color: var(--text2); font-weight: 500; }
  .alabel.on { color: var(--teal-dark); }

  .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px 18px; margin-bottom: 10px; }
  .card-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 12px; }

  .kw-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .sep-line { width: 100%; height: 1px; background: var(--border); margin: 4px 0; }
  .chip { padding: 5px 14px; font-size: 13px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg2); color: var(--text2); cursor: pointer; transition: all 0.12s; user-select: none; }
  .chip:hover { border-color: var(--teal-mid); color: var(--text); }
  .chip.on { background: var(--teal-light); border-color: var(--teal-mid); color: var(--teal-dark); font-weight: 500; }

  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg2); color: var(--text); outline: none; transition: border-color 0.15s; }
  .input-row input:focus { border-color: var(--teal-mid); background: var(--bg); }
  .input-row input::placeholder { color: var(--text3); }
  .add-btn { padding: 8px 16px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--r); background: var(--bg); color: var(--text2); cursor: pointer; font-weight: 500; transition: all 0.12s; white-space: nowrap; }
  .add-btn:hover { background: var(--bg2); color: var(--text); }

  .filter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .filter-item label { display: block; font-size: 11px; color: var(--text3); font-weight: 600; margin-bottom: 5px; letter-spacing: .04em; }
  .filter-item select { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg2); color: var(--text); outline: none; cursor: pointer; }
  .filter-item select:focus { border-color: var(--teal-mid); }

  .sheets-input { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg2); color: var(--text); outline: none; margin-bottom: 6px; transition: border-color 0.15s; }
  .sheets-input:focus { border-color: var(--teal-mid); background: var(--bg); }
  .sheets-input::placeholder { color: var(--text3); }
  .sheets-hint { font-size: 12px; color: var(--text3); }

  .search-btn { width: 100%; padding: 12px; font-size: 14px; font-weight: 600; border: 1.5px solid var(--teal); border-radius: var(--r); background: var(--teal-light); color: var(--teal-dark); cursor: pointer; margin-top: 4px; transition: all 0.15s; letter-spacing: .01em; }
  .search-btn:hover { background: var(--teal-mid); color: #fff; border-color: var(--teal); }
  .search-btn:active { transform: scale(0.99); }
  .search-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

  .results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .results-count { font-size: 14px; font-weight: 600; color: var(--text); }
  .export-btn { padding: 7px 16px; font-size: 13px; border: 1px solid var(--teal-mid); border-radius: var(--r); background: transparent; color: var(--teal-dark); cursor: pointer; font-weight: 500; transition: all 0.12s; }
  .export-btn:hover { background: var(--teal-light); }
  .export-btn:disabled { opacity: .4; cursor: not-allowed; }

  .tab-row { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .tab-btn { flex: 1; padding: 9px; font-size: 13px; font-weight: 600; border: none; background: var(--bg2); color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .tab-btn:first-child { border-right: 1px solid var(--border); }
  .tab-btn.on { background: var(--bg); color: var(--text); }
  .tab-label { font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 999px; margin-left: 5px; vertical-align: middle; }
  .tab-label-s { background: #FBEAF0; color: #72243E; }
  .tab-label-l { background: #E6F1FB; color: #0C447C; }

  .sort-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .sort-chip { padding: 5px 14px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--text2); cursor: pointer; transition: all 0.12s; font-weight: 500; }
  .sort-chip:hover { border-color: var(--border2); color: var(--text); }
  .sort-chip.on { background: var(--bg3); border-color: var(--border2); color: var(--text); }
  .sort-chip.algo { border-color: #7F77DD; color: #534AB7; background: #EEEDFE; }
  .sort-chip.algo.on { background: #CECBF6; border-color: #534AB7; color: #26215C; }

  .video-list { display: flex; flex-direction: column; gap: 8px; }
  .video-card { display: flex; gap: 12px; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--rl); text-decoration: none; transition: border-color 0.12s, box-shadow 0.12s; }
  .video-card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .vrank { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 2px; background: var(--bg3); color: var(--text2); }
  .vrank.r1 { background: var(--amber-light); color: var(--amber-dark); }
  .vrank.r2 { background: #F1EFE8; color: #444441; }
  .vrank.r3 { background: #FAECE7; color: #712B13; }
  .vthumb { width: 100px; height: 60px; object-fit: cover; border-radius: var(--r); flex-shrink: 0; background: var(--bg3); }
  .vthumb.shorts { width: 45px; height: 80px; }
  .algo-score { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; background: #EEEDFE; color: #3C3489; }
  .vinfo { flex: 1; min-width: 0; }
  .vtitle { font-size: 13px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--text); line-height: 1.45; }
  .vch { font-size: 12px; color: var(--text3); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vstats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .vst { font-size: 11px; color: var(--text2); }
  .vst b { font-weight: 600; color: var(--text); }
  .dot3 { width: 3px; height: 3px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 500; }
  .bh { background: var(--teal-light); color: var(--teal-dark); }
  .bm { background: var(--amber-light); color: var(--amber-dark); }
  .bl { background: var(--bg3); color: var(--text2); }

  .state-box { padding: 3rem 1rem; text-align: center; color: var(--text3); font-size: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--rl); }
  .state-icon { font-size: 28px; margin-bottom: 10px; }
  .ldots::after { content: '.'; animation: ld 1s infinite; }
  @keyframes ld { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

  @media (max-width: 540px) {
    .filter-grid { grid-template-columns: 1fr 1fr; }
    .vthumb { width: 80px; height: 50px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div>
      <div class="brand-title">정형외과 유튜브 트렌드</div>
      <div class="brand-sub">인기 영상 분석 · 콘텐츠 기획 레퍼런스</div>
    </div>
    <div class="auth-pill" onclick="handleAuth()">
      <div class="adot" id="ad"></div>
      <span class="alabel" id="al">구글 연결</span>
    </div>
  </div>

  <div class="tab-row">
    <button class="tab-btn on" id="tabLong" onclick="setTab('long')">롱폼 <span class="tab-label tab-label-l">15분+</span></button>
    <button class="tab-btn" id="tabShort" onclick="setTab('short')">쇼츠 <span class="tab-label tab-label-s">60초↓</span></button>
  </div>

  <div class="card">
    <div class="card-label">키워드</div>
    <div class="kw-wrap" id="kwWrap"></div>
    <div class="input-row">
      <input type="text" id="ckw" placeholder="직접 입력 후 Enter" onkeydown="if(event.key==='Enter')addC()"/>
      <button class="add-btn" onclick="addC()">+ 추가</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label">검색 조건</div>
    <div class="filter-grid">
      <div class="filter-item">
        <label>기간</label>
        <select id="fp">
          <option value="month">최근 1개월</option>
          <option value="3month">최근 3개월</option>
          <option value="6month">최근 6개월</option>
          <option value="year">최근 1년</option>
        </select>
      </div>
      <div class="filter-item">
        <label>최소 조회수</label>
        <select id="fm">
          <option value="0">제한 없음</option>
          <option value="10000">1만 이상</option>
          <option value="50000">5만 이상</option>
          <option value="100000">10만 이상</option>
          <option value="500000">50만 이상</option>
        </select>
      </div>
      <div class="filter-item">
        <label>정렬 기준</label>
        <select id="fs">
          <option value="viewCount">조회수순</option>
          <option value="date">최신순</option>
          <option value="relevance">관련도순</option>
          <option value="rating">좋아요순</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">구글 스프레드시트</div>
    <input class="sheets-input" type="text" id="su" placeholder="https://docs.google.com/spreadsheets/d/... (비워두면 새로 생성)"/>
    <div class="sheets-hint">비워두면 검색 결과를 새 스프레드시트에 자동 저장해요</div>
  </div>

  <button class="search-btn" id="sb" onclick="doSearch()">영상 검색하기</button>

  <div id="rw" style="display:none">
    <div class="divider"></div>
    <div class="results-bar">
      <span class="results-count" id="rc"></span>
      <button class="export-btn" id="xb" onclick="exportToSheets()">구글 시트로 저장</button>
    </div>
    <div class="sort-row" id="sr"></div>
    <div class="video-list" id="vl"></div>
  </div>

  <div id="stbox" class="state-box">
    <div class="state-icon">🔍</div>
    키워드를 선택하고 영상을 탐색해 보세요
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const YK='AIzaSyBHYPW77kc0m5ylTLHeAA5HYPtcrw4PstA';
const CID='479872973466-becf7hg6u1mj0goppfib3dspjpit2t1b.apps.googleusercontent.com';
const SC='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';

const PRESETS=[
  {l:'허리디스크',g:'정형외과'},{l:'무릎통증',g:'정형외과'},{l:'어깨통증',g:'정형외과'},
  {l:'오십견',g:'정형외과'},{l:'목디스크',g:'정형외과'},{l:'회전근개',g:'정형외과'},
  {l:'척추측만증',g:'정형외과'},{l:'퇴행성관절염',g:'정형외과'},
  {l:'건강정보',g:'건강/의학'},{l:'재활운동',g:'건강/의학'},
  {l:'근육통 원인',g:'건강/의학'},{l:'통증 치료',g:'건강/의학'},
];

let sel=new Set(['허리디스크','무릎통증']),customs=[],tc=null,token=null,vids=[],csort='algo',curTab='long';

function setTab(t){
  curTab=t;
  document.getElementById('tabLong').className='tab-btn'+(t==='long'?' on':'');
  document.getElementById('tabShort').className='tab-btn'+(t==='short'?' on':'');
}

function initKw(){
  const w=document.getElementById('kwWrap');w.innerHTML='';
  let lg='';
  [...PRESETS,...customs.map(k=>({l:k,g:'직접입력'}))].forEach(kw=>{
    if(kw.g!==lg&&lg!==''){const s=document.createElement('div');s.className='sep-line';w.appendChild(s);}
    lg=kw.g;
    const c=document.createElement('div');
    c.className='chip'+(sel.has(kw.l)?' on':'');
    c.textContent=kw.l;
    c.onclick=()=>{sel.has(kw.l)?sel.delete(kw.l):sel.add(kw.l);initKw();};
    w.appendChild(c);
  });
}

function addC(){
  const inp=document.getElementById('ckw'),v=inp.value.trim();
  if(v&&!customs.includes(v)){customs.push(v);sel.add(v);inp.value='';initKw();}
}

function handleAuth(){
  if(token){
    token=null;
    document.getElementById('ad').className='adot';
    document.getElementById('al').className='alabel';
    document.getElementById('al').textContent='구글 연결';
    return;
  }
  if(!tc) tc=google.accounts.oauth2.initTokenClient({
    client_id:CID, scope:SC,
    callback:(r)=>{
      if(r.access_token){
        token=r.access_token;
        document.getElementById('ad').className='adot on';
        document.getElementById('al').className='alabel on';
        document.getElementById('al').textContent='연결됨';
      }
    }
  });
  tc.requestAccessToken();
}

function getPd(p){
  const d=new Date();
  if(p==='month') d.setMonth(d.getMonth()-1);
  else if(p==='3month') d.setMonth(d.getMonth()-3);
  else if(p==='6month') d.setMonth(d.getMonth()-6);
  else d.setFullYear(d.getFullYear()-1);
  return d.toISOString();
}

function fmt(n){
  if(n>=100000000) return (n/100000000).toFixed(1)+'억';
  if(n>=10000) return Math.round(n/10000)+'만';
  if(n>=1000) return (n/1000).toFixed(1)+'천';
  return String(n);
}
function fmtD(s){
  const d=new Date(s);
  return d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0');
}
function dys(s){ return Math.floor((Date.now()-new Date(s))/86400000); }

async function doSearch(){
  const kws=[...sel];
  if(!kws.length){alert('키워드를 하나 이상 선택해 주세요.');return;}
  const btn=document.getElementById('sb');
  btn.disabled=true; btn.textContent='검색 중...';
  document.getElementById('stbox').style.display='block';
  document.getElementById('stbox').innerHTML='<div class="state-icon">🔄</div><span class="ldots">영상 수집 중</span>';
  document.getElementById('rw').style.display='none';
  vids=[];

  const period=document.getElementById('fp').value;
  const so=document.getElementById('fs').value;
  const mv=parseInt(document.getElementById('fm').value);
  const after=getPd(period);
  const durParams=curTab==='short'?['&videoDuration=short']:['&videoDuration=medium','&videoDuration=long'];

  try{
    const vm={};
    for(const kw of kws){
      for(const dur of durParams){
        const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(kw)}&type=video&regionCode=KR&relevanceLanguage=ko&order=${so}&publishedAfter=${after}&maxResults=10${dur}&key=${YK}`);
        const d=await r.json();
        if(!d.items) continue;
        d.items.forEach(it=>{const id=it.id.videoId;if(!vm[id])vm[id]={id,sn:it.snippet,kw};});
      }
    }
    const ids=Object.keys(vm);
    if(!ids.length) throw new Error('검색 결과가 없어요. 기간이나 키워드를 조정해 보세요.');

    const sr2=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails&id=${ids.join(',')}&key=${YK}`);
    const sd=await sr2.json();

    sd.items.forEach(it=>{
      const b=vm[it.id]; if(!b) return;
      const views=parseInt(it.statistics.viewCount||0);
      const likes=parseInt(it.statistics.likeCount||0);
      const comments=parseInt(it.statistics.commentCount||0);
      const eng=views>0?parseFloat(((likes+comments)/views*100).toFixed(2)):0;
      const d2=dys(b.sn.publishedAt);
      const vpd=d2>0?Math.round(views/d2):views;
      if(views<mv) return;

      const likeRate=views>0?(likes/views*100):0;
      const cmtRate=views>0?(comments/views*100):0;
      const earlyBonus=d2<=7?1.3:d2<=30?1.1:1.0;
      const algoRaw=(vpd*0.4)+(likeRate*3000*0.3)+(cmtRate*5000*0.2)+(vpd*0.1*(earlyBonus-1)*10);
      const algo=Math.round(algoRaw);

      vids.push({id:it.id,title:b.sn.title,ch:b.sn.channelTitle,
        thumb:b.sn.thumbnails?.medium?.url||'',pub:b.sn.publishedAt,
        views,likes,comments,eng,vpd,kw:b.kw,algo,d2});
    });

    if(!vids.length) throw new Error('조건에 맞는 영상이 없어요. 최소 조회수를 낮춰 보세요.');
    render();
  }catch(e){
    document.getElementById('stbox').innerHTML=`<div class="state-icon">⚠️</div>${e.message||'오류가 발생했어요.'}`;
  }finally{
    btn.disabled=false; btn.textContent='영상 검색하기';
  }
}

function render(){
  let s=[...vids];
  if(csort==='views') s.sort((a,b)=>b.views-a.views);
  else if(csort==='eng') s.sort((a,b)=>b.eng-a.eng);
  else if(csort==='vpd') s.sort((a,b)=>b.vpd-a.vpd);
  else if(csort==='likes') s.sort((a,b)=>b.likes-a.likes);
  else if(csort==='algo') s.sort((a,b)=>b.algo-a.algo);

  document.getElementById('stbox').style.display='none';
  document.getElementById('rw').style.display='block';
  const tabLabel=curTab==='short'?'쇼츠':'롱폼';
  document.getElementById('rc').textContent=`${tabLabel} ${s.length}개`;

  const sdefs=[
    {k:'algo',l:'⚡ 알고리즘 점수',cls:'algo'},
    {k:'views',l:'조회수',cls:''},
    {k:'vpd',l:'일평균 조회수',cls:''},
    {k:'eng',l:'참여율',cls:''},
    {k:'likes',l:'좋아요',cls:''}
  ];
  document.getElementById('sr').innerHTML=sdefs.map(x=>`<div class="sort-chip ${x.cls}${csort===x.k?' on':''}" onclick="ss('${x.k}')">${x.l}</div>`).join('');

  const isShort=curTab==='short';
  const vl=document.getElementById('vl'); vl.innerHTML='';
  s.forEach((v,i)=>{
    const ec=v.eng>=5?'bh':v.eng>=2?'bm':'bl';
    const el=v.eng>=5?'참여율 높음':v.eng>=2?'참여율 보통':'참여율 낮음';
    const rk=i<3?`r${i+1}`:'';
    const freshTag=v.d2<=7?' 🔥':'';
    const c=document.createElement('a');
    c.className='video-card';
    c.href=`https://www.youtube.com/watch?v=${v.id}`;
    c.target='_blank'; c.rel='noopener';
    c.innerHTML=`
      <div class="vrank ${rk}">${i+1}</div>
      <img class="vthumb${isShort?' shorts':''}" src="${v.thumb}" alt="" loading="lazy"/>
      <div class="vinfo">
        <div class="vtitle">${v.title}${freshTag}</div>
        <div class="vch">${v.ch} · ${fmtD(v.pub)}</div>
        <div class="vstats">
          <span class="algo-score">⚡${v.algo.toLocaleString()}</span>
          <div class="dot3"></div>
          <span class="vst"><b>${fmt(v.views)}</b> 조회</span>
          <div class="dot3"></div>
          <span class="vst">일평균 <b>${fmt(v.vpd)}</b></span>
          <div class="dot3"></div>
          <span class="badge ${ec}">${el} ${v.eng.toFixed(1)}%</span>
        </div>
      </div>`;
    vl.appendChild(c);
  });
}

function ss(k){ csort=k; render(); }

async function exportToSheets(){
  if(!token){alert('먼저 구글 계정에 로그인해 주세요.');return;}
  if(!vids.length){alert('저장할 결과가 없어요.');return;}
  const xb=document.getElementById('xb');
  xb.disabled=true; xb.textContent='저장 중...';
  try{
    let sid;
    const uv=document.getElementById('su').value.trim();
    const m=uv.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if(m){sid=m[1];}else{
      const cr=await fetch('https://sheets.googleapis.com/v4/spreadsheets',{
        method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({properties:{title:'유튜브 트렌드 분석 '+new Date().toLocaleDateString('ko-KR')}})
      });
      const cd=await cr.json(); sid=cd.spreadsheetId;
    }
    const st='트렌드_'+new Date().toLocaleDateString('ko-KR').replace(/\./g,'').replace(/ /g,'');
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({requests:[{addSheet:{properties:{title:st}}}]})
    });
    const hd=[['순위','유형','제목','채널','키워드','알고리즘점수','조회수','좋아요','댓글','참여율(%)','일평균조회수','업로드일','URL']];
    const rows=vids.map((v,i)=>[i+1,curTab==='short'?'쇼츠':'롱폼',v.title,v.ch,v.kw,v.algo,v.views,v.likes,v.comments,v.eng,v.vpd,fmtD(v.pub),`https://www.youtube.com/watch?v=${v.id}`]);
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(st)}!A1:append?valueInputOption=USER_ENTERED`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({values:[...hd,...rows]})
    });
    window.open(`https://docs.google.com/spreadsheets/d/${sid}`,'_blank');
    xb.textContent='저장 완료!';
    setTimeout(()=>{xb.textContent='구글 시트로 저장';xb.disabled=false;},2500);
  }catch(e){
    alert('저장 오류: '+e.message);
    xb.textContent='구글 시트로 저장'; xb.disabled=false;
  }
}

initKw();
</script>
